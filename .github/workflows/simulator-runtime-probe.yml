name: Conductor installed simulator runtime probe

on:
  push:
    branches: [main]
    paths: [.github/workflows/simulator-runtime-probe.yml]

permissions:
  contents: read

jobs:
  runtime-probe:
    if: ${{ github.repository == 'alvarovillalbaa/conductor' && github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 3
    steps:
      - name: Read installed Xcode runtimes and iPhone device types only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, selectors, signal, subprocess, time

          class ProbeError(Exception): pass
          interrupted = False
          phase = 'xcode'
          env = {key: os.environ[key] for key in ('PATH', 'HOME', 'TMPDIR', 'DEVELOPER_DIR') if key in os.environ}
          env.update({'LANG': 'en_US.UTF-8', 'TZ': 'UTC'})

          def interrupt(_value, _frame):
              global interrupted
              if not interrupted:
                  interrupted = True
                  raise ProbeError('interrupted')

          previous = {value: signal.signal(value, interrupt) for value in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP)}

          def read(argv):
              process = subprocess.Popen(argv, env=env, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
              selector = selectors.DefaultSelector()
              buffers = {'stdout': bytearray(), 'stderr': bytearray()}
              deadline = time.monotonic() + 30
              completed = False
              try:
                  for stream, name in ((process.stdout, 'stdout'), (process.stderr, 'stderr')):
                      os.set_blocking(stream.fileno(), False)
                      selector.register(stream, selectors.EVENT_READ, name)
                  while selector.get_map():
                      if time.monotonic() >= deadline: raise ProbeError('command_deadline')
                      for key, _ in selector.select(0.1):
                          chunk = os.read(key.fileobj.fileno(), 65536)
                          if not chunk:
                              selector.unregister(key.fileobj)
                              continue
                          limit = 1048576 if key.data == 'stdout' else 65536
                          if len(buffers[key.data]) + len(chunk) > limit: raise ProbeError('command_output_limit')
                          buffers[key.data].extend(chunk)
                  remaining = deadline - time.monotonic()
                  if remaining <= 0: raise ProbeError('command_deadline')
                  if process.wait(timeout=remaining) != 0: raise ProbeError('command_failed')
                  completed = True
                  return buffers['stdout'].decode('utf8', errors='strict')
              finally:
                  selector.close()
                  if not completed:
                      try: os.killpg(process.pid, signal.SIGTERM)
                      except ProcessLookupError: pass
                      try: process.wait(timeout=3)
                      except subprocess.TimeoutExpired:
                          try: os.killpg(process.pid, signal.SIGKILL)
                          except ProcessLookupError: pass
                          process.wait(timeout=3)
                  process.stdout.close()
                  process.stderr.close()

          def field(value, maximum=256):
              if not isinstance(value, str) or not value or len(value) > maximum or re.search('[\x00-\x1f\x7f]', value): raise ProbeError('metadata_shape_invalid')
              return value

          try:
              xcode = read(['xcodebuild', '-version'])
              match = re.fullmatch(r'Xcode ([0-9.]+)\s+Build version ([A-Za-z0-9]+)\s*', xcode)
              if not match: raise ProbeError('xcode_version_shape_invalid')
              phase = 'runtimes'
              runtimes = json.loads(read(['xcrun', 'simctl', 'list', 'runtimes', '--json'])).get('runtimes')
              phase = 'device_types'
              devices = json.loads(read(['xcrun', 'simctl', 'list', 'devicetypes', '--json'])).get('devicetypes')
              if not isinstance(runtimes, list) or len(runtimes) > 100 or not isinstance(devices, list) or len(devices) > 500: raise ProbeError('metadata_shape_invalid')
              phones = sorted({field(row['identifier']) for row in devices if isinstance(row, dict) and isinstance(row.get('name'), str) and row['name'].startswith('iPhone') and isinstance(row.get('identifier'), str) and row['identifier'].startswith('com.apple.CoreSimulator.SimDeviceType.iPhone-')})
              observed = []
              for row in runtimes:
                  if not isinstance(row, dict) or type(row.get('isAvailable')) is not bool: raise ProbeError('metadata_shape_invalid')
                  runtime = {key: field(row.get(key)) for key in ('identifier', 'name', 'version')}
                  runtime['isAvailable'] = row['isAvailable']
                  if 'supportedDeviceTypes' in row:
                      supported = row['supportedDeviceTypes']
                      if not isinstance(supported, list) or len(supported) > 500: raise ProbeError('metadata_shape_invalid')
                      runtime['matchingIPhoneDeviceTypeIdentifiers'] = sorted({item['identifier'] for item in supported if isinstance(item, dict) and item.get('identifier') in phones})
                  observed.append(runtime)
              output = json.dumps({'xcode': {'version': match[1], 'build': match[2]}, 'runtimes': observed, 'iPhoneDeviceTypeIdentifiers': phones}, separators=(',', ':'))
              if len(output.encode()) > 65536: raise ProbeError('report_limit')
              if interrupted: raise ProbeError('interrupted')
              print('SIMULATOR_RUNTIME_PROBE ' + output)
          except Exception as error:
              reason = str(error) if isinstance(error, ProbeError) else 'metadata_probe_failed'
              print(json.dumps({'simulatorRuntimeProbeError': {'phase': phase, 'reason': reason}}))
              raise SystemExit(1)
          finally:
              for value, handler in previous.items(): signal.signal(value, handler)
          PY
