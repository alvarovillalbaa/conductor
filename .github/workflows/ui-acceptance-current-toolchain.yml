name: Temporary Conductor current toolchain UI check
on:
  create:
permissions:
  contents: read
jobs:
  ui-acceptance:
    if: github.repository == 'alvarovillalbaa/conductor' && github.event.repository.private == false && github.event.ref_type == 'branch' && github.event.ref == 'qa/conductor-current-toolchain-20261111-7'
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 8d08626acec7745ba745bd47bfe6df0919563f6b
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          fetch-depth: 1
          clean: false
      - name: One sealed UI case and owned simulator cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 script/run_ui_acceptance.py --source-commit "$SOURCE_COMMIT" | tee "$RUNNER_TEMP/conductor-current-toolchain.log"
      - name: Retain the bounded controller result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: conductor-current-toolchain-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/conductor-current-toolchain.log
            ${{ runner.temp }}/conductor-storage-${{ github.run_id }}.xml
            ${{ runner.temp }}/conductor-ui-images-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
