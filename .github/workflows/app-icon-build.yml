name: Conductor app icon build

on:
  push:
    branches: [main]
    paths: [.github/workflows/app-icon-build.yml]

permissions:
  contents: read

jobs:
  icon-build:
    if: ${{ github.repository == 'alvarovillalbaa/conductor' && github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # Immutable preparation commit containing the source seal.
      SOURCE_COMMIT: e278b0798faaea57df97a5d2b63b910340b55e0c
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify icon sources and compile unsigned Simulator assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, plistlib, re, selectors
          import shutil, signal, stat, subprocess, sys, tempfile, time, zlib

          seal_path = 'docs/results/2026/10-31/app-icon-build-source.json'
          source_pin = os.environ.get('SOURCE_COMMIT', '')
          problems, signals, commands = [], [], []
          task = identity = current = before = after = compiled = None
          cleanup = {'commandsReaped': False, 'ownedScratchRemoved': False}
          env = {'PATH': os.environ.get('PATH', '/usr/bin:/bin'), 'TZ': 'UTC', 'LANG': 'en_US.UTF-8'}
          sha = lambda data: hashlib.sha256(data).hexdigest()

          def fail(code):
              raise RuntimeError(code)

          def git(*args):
              return subprocess.check_output(['/usr/bin/git', *args], env=env, timeout=15)

          def source_guard():
              head = git('rev-parse', 'HEAD').decode().strip()
              if not re.fullmatch('[a-f0-9]{40}', source_pin) or head != source_pin:
                  fail('source_identity_changed')
              seal_file = pathlib.Path(seal_path)
              seal_stat = seal_file.lstat()
              if not stat.S_ISREG(seal_stat.st_mode) or stat.S_IMODE(seal_stat.st_mode) != 0o644:
                  fail('seal_type_or_mode_changed')
              raw = seal_file.read_bytes()
              if raw != git('show', 'HEAD:' + seal_path):
                  fail('seal_changed')
              seal = json.loads(raw)
              if seal.get('schemaVersion') != 'conductor.app-icon-build-source.v1' or seal.get('baseCommit') != '151a50f59a40bde5ff4a6fff068812b19008a10b' or seal.get('excludedPrefixes') != ['docs/results/'] or seal.get('fileCount') != 47:
                  fail('seal_invalid')
              rows = seal.get('files', [])
              if len(rows) != 47 or len({row['path'] for row in rows}) != 47:
                  fail('seal_invalid')
              tree, index = {}, {}
              for record in git('ls-tree', '-rz', '--full-tree', 'HEAD').split(b'\0'):
                  if not record: continue
                  metadata, raw_path = record.split(b'\t', 1)
                  mode, kind, blob = metadata.decode().split()
                  path = raw_path.decode()
                  if path.startswith('docs/results/') and path != seal_path: continue
                  if kind != 'blob': fail('source_type_changed')
                  tree[path] = (mode, blob)
              for record in git('ls-files', '--stage', '-z').split(b'\0'):
                  if not record: continue
                  metadata, raw_path = record.split(b'\t', 1)
                  mode, blob, stage = metadata.decode().split()
                  path = raw_path.decode()
                  if path.startswith('docs/results/') and path != seal_path: continue
                  if stage != '0' or path in index: fail('index_changed')
                  index[path] = (mode, blob)
              if tree != index or set(tree) != {row['path'] for row in rows} | {seal_path}:
                  fail('source_paths_changed')
              observed = []
              for row in rows:
                  path = row['path']
                  if not isinstance(path, str) or pathlib.PurePosixPath(path).is_absolute() or any(part in ('', '.', '..') for part in path.split('/')) or re.search('[\x00-\x1f]', path) or path.startswith('docs/results/'):
                      fail('source_path_invalid')
                  file = pathlib.Path(path)
                  info = file.lstat()
                  if not stat.S_ISREG(info.st_mode) or row['mode'] not in ('100644', '100755'):
                      fail('source_type_changed')
                  data = file.read_bytes()
                  blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  actual = {'path': path, 'mode': '100755' if stat.S_IMODE(info.st_mode) == 0o755 else '100644' if stat.S_IMODE(info.st_mode) == 0o644 else 'invalid', 'gitBlob': blob, 'bytes': len(data), 'sha256': sha(data)}
                  if actual != row or tree[path] != (row['mode'], row['gitBlob']):
                      fail('source_bytes_or_mode_changed')
                  observed.append(actual)
              if sum(row['bytes'] for row in observed) != seal.get('totalBytes') or git('status', '--porcelain=v1', '-z', '--untracked-files=all', '--', '.', ':(exclude)docs/results/**'):
                  fail('source_dirty')
              return {'commit': head, 'tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'sealSha256': sha(raw), 'files': observed}

          def caught(value, _frame):
              signals.append(signal.Signals(value).name)

          old_handlers = {value: signal.signal(value, caught) for value in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP)}

          def stop_group(process, value):
              try: os.killpg(process.pid, value)
              except ProcessLookupError: pass

          def run(name, argv, seconds, limit, keep_text=False):
              global current
              if signals: fail('interrupted')
              started = time.monotonic()
              process = subprocess.Popen(argv, env=env, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, start_new_session=True)
              current = process
              count, digest, tail, reason, stopped_at = 0, hashlib.sha256(), bytearray(), None, None
              selector = selectors.DefaultSelector()
              os.set_blocking(process.stdout.fileno(), False)
              selector.register(process.stdout, selectors.EVENT_READ)
              try:
                  while selector.get_map():
                      now = time.monotonic()
                      if reason is None and (signals or now - started > seconds):
                          reason = 'interrupted' if signals else 'deadline'
                          stopped_at = now
                          stop_group(process, signal.SIGTERM)
                      if stopped_at is not None and now - stopped_at >= 3:
                          stop_group(process, signal.SIGKILL)
                      if stopped_at is not None and now - stopped_at >= 6:
                          reason = reason or 'settlement_timeout'
                          break
                      for key, _ in selector.select(0.1):
                          chunk = os.read(key.fileobj.fileno(), 65536)
                          if not chunk:
                              selector.unregister(key.fileobj)
                              continue
                          count += len(chunk)
                          digest.update(chunk)
                          tail.extend(chunk)
                          del tail[:-24576]
                          if count > limit and reason is None:
                              reason, stopped_at = 'output_limit', time.monotonic()
                              stop_group(process, signal.SIGTERM)
                  try: code = process.wait(timeout=3)
                  except subprocess.TimeoutExpired:
                      reason = reason or 'settlement_timeout'
                      stop_group(process, signal.SIGKILL)
                      code = process.wait(timeout=3)
              finally:
                  selector.close()
                  process.stdout.close()
                  if process.poll() is None:
                      stop_group(process, signal.SIGKILL)
                      process.wait(timeout=3)
                  current = None
              text = tail.decode('utf8', errors='replace')
              result = {'name': name, 'command': [str(arg).replace(str(task), '<owned-scratch>') for arg in argv], 'exitCode': code, 'stop': reason, 'bytes': count, 'sha256': digest.hexdigest(), 'elapsedMs': round((time.monotonic() - started) * 1000), 'buildSucceededMarker': '** BUILD SUCCEEDED **' in text}
              if keep_text: result['text'] = text
              if code != 0 or reason is not None: result['failureTail'] = text
              commands.append(result)
              if code != 0 or reason is not None: fail(name + '_failed')
              return result

          try:
              if sys.platform != 'darwin': fail('runner_platform_changed')
              parent = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              if not parent.is_dir(): fail('runner_temp_invalid')
              task = pathlib.Path(tempfile.mkdtemp(prefix='conductor-icon-', dir=parent))
              identity = task.lstat()
              for name in ('home', 'tmp'): (task / name).mkdir(mode=0o700)
              env.update({'HOME': str(task / 'home'), 'TMPDIR': str(task / 'tmp')})
              developer = os.environ.get('DEVELOPER_DIR')
              if developer:
                  if not pathlib.Path(developer).is_absolute() or not pathlib.Path(developer).is_dir() or re.search('[\x00-\x1f]', developer): fail('developer_directory_invalid')
                  env['DEVELOPER_DIR'] = developer
              before = source_guard()
              run('macos', ['/usr/bin/sw_vers'], 10, 8192, True)
              run('xcode', ['xcodebuild', '-version'], 15, 8192, True)
              run('swift', ['xcrun', 'swift', '--version'], 20, 8192, True)
              run('simulator_sdk', ['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], 15, 8192, True)
              run('icon_renderer', [sys.executable, 'script/render_app_icon.py', '--check'], 120, 65536, True)
              run('metadata', ['plutil', '-lint', 'Resources/Info.plist', 'Resources/PrivacyInfo.xcprivacy', 'Conductor.xcodeproj/project.pbxproj'], 20, 65536, True)
              run('whitespace', ['/usr/bin/git', 'diff', '--check'], 15, 65536, True)
              result = run('unsigned_simulator_build', ['xcodebuild', '-project', 'Conductor.xcodeproj', '-scheme', 'Conductor', '-configuration', 'Debug', '-sdk', 'iphonesimulator', '-destination', 'generic/platform=iOS Simulator', '-derivedDataPath', str(task / 'DerivedData'), 'CODE_SIGNING_ALLOWED=NO', 'build'], 900, 2097152)
              if not result['buildSucceededMarker']: fail('build_success_marker_missing')
              bundle = task / 'DerivedData/Build/Products/Debug-iphonesimulator/Conductor.app'
              info = plistlib.loads((bundle / 'Info.plist').read_bytes())
              icon = info.get('CFBundleIcons', {}).get('CFBundlePrimaryIcon', {}).get('CFBundleIconName')
              if icon != 'AppIcon' or info.get('CFBundleExecutable') != 'Conductor': fail('compiled_icon_metadata_invalid')
              compiled = {}
              for name in ('Info.plist', 'Assets.car', 'Conductor'):
                  file = bundle / name
                  metadata = file.lstat()
                  if not stat.S_ISREG(metadata.st_mode) or metadata.st_size == 0: fail('compiled_output_missing')
                  digest = hashlib.sha256()
                  with file.open('rb') as stream:
                      for chunk in iter(lambda: stream.read(65536), b''): digest.update(chunk)
                  compiled[name] = {'bytes': metadata.st_size, 'sha256': digest.hexdigest()}
          except Exception as error:
              code = str(error)
              problems.append(code if re.fullmatch('[a-z_]{1,80}', code) else 'controller_failed')
          finally:
              cleanup['commandsReaped'] = current is None
              if before is not None:
                  try:
                      after = source_guard()
                      if after != before: fail('post_source_changed')
                  except Exception: problems.append('post_source_guard_failed')
              if task is not None:
                  try:
                      actual = task.lstat()
                      if not cleanup['commandsReaped'] or not stat.S_ISDIR(actual.st_mode) or (actual.st_dev, actual.st_ino, actual.st_uid) != (identity.st_dev, identity.st_ino, os.getuid()): fail('scratch_identity_changed')
                      shutil.rmtree(task)
                      cleanup['ownedScratchRemoved'] = True
                  except Exception: problems.append('scratch_cleanup_failed')
          passed = not problems and not signals and before is not None and after == before and compiled is not None and all(cleanup.values())
          report = {'schemaVersion': 'conductor.app-icon-build.v1', 'sourceCommit': source_pin, 'workflowCommit': os.environ.get('GITHUB_SHA'), 'runtime': {'python': platform.python_version(), 'zlib': zlib.ZLIB_RUNTIME_VERSION, 'platform': sys.platform, 'arch': platform.machine()}, 'commands': commands, 'sourceGuard': {'before': before, 'after': after}, 'compiled': compiled, 'cleanup': cleanup, 'signals': signals, 'problems': problems, 'coreTestsRun': 0, 'passed': passed, 'proofLimits': 'Unsigned generic Simulator app/asset compilation only; no simulator boot, app launch, notification, signing, account, store, model/provider call, dependency installation or rendered icon/device acceptance.'}
          encoded = json.dumps(report, separators=(',', ':'))
          if len(encoded.encode()) > 131072:
              print('CONDUCTOR_ICON_REPORT {"passed":false,"reason":"report_limit"}')
              passed = False
          else:
              print('CONDUCTOR_ICON_REPORT ' + encoded)
          for value, handler in old_handlers.items(): signal.signal(value, handler)
          sys.exit(0 if passed else 1)
          PY
