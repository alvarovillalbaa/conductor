name: Conductor simulator environment probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/simulator-environment-probe.yml]

permissions:
  contents: read

jobs:
  metadata:
    if: github.repository == 'alvarovillalbaa/conductor' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 6
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Compare three bounded metadata queries without simulator changes
        run: |
          python3 -B -S - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import selectors
          import shutil
          import signal
          import stat
          import subprocess
          import sys
          import tempfile
          import time
          import uuid

          started = time.monotonic()
          deadline = started + 270
          interrupted = None
          root = identity = marker_identity = nonce = parent = None
          commands = []
          report = {
              "schemaVersion": "conductor.simulator-environment-probe.v1",
              "preparedFromSource": "73bc9c595eeca2a9df9e77a8eef9bdbb63ec4997",
              "workflowCommit": os.environ.get("GITHUB_SHA"),
              "startedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "status": "failed", "commands": commands,
              "scope": {"metadataOnly": True, "runtimeQueries": 3,
                        "order": ["runner-system-1", "fresh-owned", "runner-system-2"],
                        "xcode": "16.4", "xcodeBuild": "16F6", "sdk": "18.5",
                        "runtime": "com.apple.CoreSimulator.SimRuntime.iOS-18-5"},
              "limits": {"workSeconds": 270, "cleanupSeconds": 30,
                         "querySeconds": 60, "toolchainCheckSeconds": 20,
                         "termGraceSeconds": 3, "postKillDrainSeconds": 3,
                         "stdoutBytes": 1048576, "stderrBytes": 65536},
              "interpretation": "Only observed ordered profile differences; preceding queries can warm caches or services, so this does not establish TMPDIR causality or UI acceptance.",
          }

          def require(ok, code):
              if not ok:
                  raise RuntimeError(code)

          def on_signal(number, frame):
              global interrupted
              interrupted = signal.Signals(number).name

          prior_handlers = {s: signal.signal(s, on_signal)
                            for s in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP)}

          def owned():
              current = root.lstat()
              require(root.parent == parent and stat.S_ISDIR(current.st_mode)
                      and (current.st_dev, current.st_ino) == identity,
                      "owned_directory_identity_changed")
              fd = os.open(root / "owner", os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  marker = os.fstat(fd)
                  require(stat.S_ISREG(marker.st_mode) and marker.st_size <= 64
                          and (marker.st_dev, marker.st_ino) == marker_identity
                          and os.read(fd, 65) == nonce.encode("ascii"), "owned_marker_changed")
              finally:
                  os.close(fd)

          def group_signal(process, number):
              try:
                  os.killpg(process.pid, number)
              except ProcessLookupError:
                  pass

          def run(label, args, env, seconds):
              row = {"label": label, "exitCode": None, "stop": None,
                     "reaped": True, "started": False}
              commands.append(row)
              if interrupted or time.monotonic() >= deadline - 10:
                  row["stop"] = "interrupted_before_start" if interrupted else "work_budget_exhausted"
                  return None, row
              command_started = time.monotonic()
              finish_by = min(command_started + seconds, deadline - 10)
              try:
                  process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                             env=env, start_new_session=True)
              except (OSError, ValueError):
                  row["stop"] = "spawn_failed"
                  return None, row
              row["started"], row["reaped"] = True, False
              selector = None
              counts, buffers = [0, 0], [bytearray(), bytearray()]
              hashes = [hashlib.sha256(), hashlib.sha256()]
              eof, caps = [False, False], [1048576, 65536]
              stopped = killed_at = None
              try:
                  selector = selectors.DefaultSelector()
                  for index, stream in enumerate((process.stdout, process.stderr)):
                      selector.register(stream, selectors.EVENT_READ, index)
                  while selector.get_map() or process.poll() is None:
                      now = time.monotonic()
                      if stopped is None and (interrupted or now >= finish_by):
                          row["stop"] = "interrupted" if interrupted else "timeout"
                          stopped = now
                          group_signal(process, signal.SIGTERM)
                      if stopped is not None and killed_at is None and now - stopped >= 3:
                          killed_at = now
                          group_signal(process, signal.SIGKILL)
                      if killed_at is not None and now - killed_at >= 3:
                          row["drainBoundReached"] = True
                          break
                      for key, _ in selector.select(0.05):
                          data = os.read(key.fileobj.fileno(), 65536)
                          index = key.data
                          if not data:
                              eof[index] = True
                              selector.unregister(key.fileobj)
                              key.fileobj.close()
                              continue
                          counts[index] += len(data)
                          hashes[index].update(data)
                          buffers[index].extend(data[:max(0, caps[index] - len(buffers[index]))])
                          if counts[index] > caps[index] and stopped is None:
                              row["stop"], stopped = "output_limit", time.monotonic()
                              group_signal(process, signal.SIGTERM)
                  try:
                      row["exitCode"] = process.wait(timeout=1)
                  except subprocess.TimeoutExpired:
                      row["stop"] = "reap_timeout"
              except (OSError, ValueError):
                  row["stop"] = "pipe_failure"
              finally:
                  if selector is not None:
                      for key in list(selector.get_map().values()):
                          selector.unregister(key.fileobj)
                          key.fileobj.close()
                      selector.close()
                  for stream in (process.stdout, process.stderr):
                      if not stream.closed:
                          stream.close()
                  if process.poll() is None:
                      group_signal(process, signal.SIGKILL)
                      try:
                          row["exitCode"] = process.wait(timeout=2)
                      except subprocess.TimeoutExpired:
                          row["stop"] = "reap_timeout"
                  row["reaped"] = process.poll() is not None
                  row["elapsedMs"] = round((time.monotonic() - command_started) * 1000)
              for index, name in enumerate(("stdout", "stderr")):
                  row[name] = {"observedBytes": counts[index], "capturedBytes": len(buffers[index]),
                               "observedSha256": hashes[index].hexdigest(),
                               "capturedSha256": hashlib.sha256(buffers[index]).hexdigest(),
                               "observedComplete": eof[index],
                               "capturedComplete": eof[index] and counts[index] <= caps[index]}
              row["processPassed"] = (row["exitCode"] == 0 and row["stop"] is None
                                      and row["reaped"] and all(eof)
                                      and all(counts[i] <= caps[i] for i in (0, 1)))
              return bytes(buffers[0]) if row["processPassed"] else None, row

          try:
              require(os.environ.get("GITHUB_REPOSITORY") == "alvarovillalbaa/conductor"
                      and os.environ.get("GITHUB_REF") == "refs/heads/main"
                      and re.fullmatch(r"[0-9a-f]{40}", report["workflowCommit"] or ""),
                      "workflow_scope_invalid")
              system_tmp = os.environ["TMPDIR"]
              require(os.path.isabs(system_tmp) and Path(system_tmp).is_dir(), "runner_tmpdir_invalid")
              parent = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
              root = Path(tempfile.mkdtemp(prefix="conductor-simulator-probe-", dir=parent))
              current = root.lstat()
              identity = (current.st_dev, current.st_ino)
              nonce = uuid.uuid4().hex
              with (root / "owner").open("x", encoding="ascii") as marker:
                  marker.write(nonce)
              current_marker = (root / "owner").lstat()
              marker_identity = (current_marker.st_dev, current_marker.st_ino)
              owned()
              base_env = {"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "HOME": os.environ["HOME"],
                          "LANG": "en_US.UTF-8",
                          "DEVELOPER_DIR": "/Applications/Xcode_16.4.app/Contents/Developer"}
              runner_env = dict(base_env, TMPDIR=system_tmp)
              fresh_env = dict(base_env, TMPDIR=str(root))
              toolchain_passed = True
              for label, args, expected in (
                  ("xcode-version", ["xcodebuild", "-version"], "Xcode 16.4\nBuild version 16F6"),
                  ("simulator-sdk", ["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], "18.5"),
              ):
                  raw, row = run(label, args, runner_env, 20)
                  try:
                      row["metadataValid"] = raw is not None and raw.decode("utf-8").strip() == expected
                  except UnicodeError:
                      row["metadataValid"] = False
                  toolchain_passed = toolchain_passed and row["metadataValid"]
              report["toolchainPassed"] = toolchain_passed
              if toolchain_passed:
                  for label, env in (("runner-system-1", runner_env), ("fresh-owned", fresh_env),
                                     ("runner-system-2", runner_env)):
                      owned()
                      raw, row = run(label, ["xcrun", "simctl", "list", "runtimes", "-j"], env, 60)
                      row["metadataValid"] = False
                      if raw is not None:
                          try:
                              value = json.loads(raw.decode("utf-8"))
                              runtimes = value["runtimes"]
                              require(isinstance(runtimes, list) and all(isinstance(x, dict) for x in runtimes),
                                      "runtime_schema_invalid")
                              matches = [x for x in runtimes if x.get("identifier") == report["scope"]["runtime"]]
                              version = matches[0].get("version") if len(matches) == 1 else None
                              available = matches[0].get("isAvailable") if len(matches) == 1 else None
                              row["projection"] = {"runtimeCount": len(runtimes), "targetCount": len(matches),
                                                   "targetVersion": version if isinstance(version, str) and re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,2}", version) and len(version) <= 16 else None,
                                                   "targetAvailable": available if isinstance(available, bool) else None}
                              row["metadataValid"] = (len(matches) == 1 and matches[0].get("version") == "18.5"
                                                      and matches[0].get("isAvailable") is True)
                          except (UnicodeError, ValueError, TypeError, KeyError, RuntimeError):
                              row["parseFailure"] = "runtime_json_or_schema_invalid"
              else:
                  report["queriesNotStarted"] = "exact_toolchain_not_confirmed"
          except (OSError, ValueError, KeyError, RuntimeError):
              report["preparationFailure"] = "runner_identity_or_owned_metadata_invalid"
          finally:
              report["interrupted"] = interrupted
              report["processesReaped"] = all(row["reaped"] for row in commands)
              report["cleanup"] = {"status": "failed", "ownedRootRemoved": False}
              def cleanup_alarm(number, frame):
                  raise TimeoutError("cleanup_deadline")
              previous_alarm = signal.signal(signal.SIGALRM, cleanup_alarm)
              signal.setitimer(signal.ITIMER_REAL, 30)
              try:
                  if root is None:
                      report["cleanup"] = {"status": "passed", "ownedRootRemoved": False, "reason": "not-allocated"}
                  else:
                      require(report["processesReaped"], "unreaped_process_cleanup_refused")
                      owned()
                      shutil.rmtree(root)
                      require(not root.exists(), "owned_cleanup_incomplete")
                      report["cleanup"] = {"status": "passed", "ownedRootRemoved": True}
              except (OSError, ValueError, RuntimeError, TimeoutError):
                  report["cleanup"]["reason"] = "owned_identity_reap_or_cleanup_bound_failed"
              finally:
                  signal.setitimer(signal.ITIMER_REAL, 0)
                  signal.signal(signal.SIGALRM, previous_alarm)
              rows = [row for row in commands if row["label"] in report["scope"]["order"]]
              if (report.get("toolchainPassed") and len(rows) == 3
                      and [row["label"] for row in rows] == report["scope"]["order"]
                      and all(row.get("processPassed") and row.get("metadataValid") for row in rows)
                      and not report.get("preparationFailure") and not interrupted
                      and report["processesReaped"] and report["cleanup"]["status"] == "passed"):
                  report["status"] = "passed"
              report["elapsedMs"] = round((time.monotonic() - started) * 1000)
              report["interrupted"] = interrupted
              report["finishedAt"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              for number, handler in prior_handlers.items():
                  signal.signal(number, handler)
              output = json.dumps(report, separators=(",", ":"))
              if len(output.encode("utf-8")) > 32768:
                  output = json.dumps({"schemaVersion": report["schemaVersion"], "status": "failed", "reason": "report_bound"})
                  report["status"] = "failed"
              print(output, flush=True)
          sys.exit(0 if report["status"] == "passed" else 1)
          PY
